name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      test-project: tests/LogPipe.Contracts.Tests/LogPipe.Contracts.Tests.csproj
      dotnet-version: "10.0.x"
      coverage-threshold: "80"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Pack
        run: dotnet pack src/LogPipe.Contracts/LogPipe.Contracts.csproj -c Release -o nupkgs
      - name: Create GitHub Release with package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset="nupkgs/LogPipe.Contracts.${version}.nupkg"
          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LogPipe.Contracts $tag" \
            --notes "Versioned gRPC contract for the logpipe pipeline. Pin in Directory.Packages.props and fetch via fetch-contracts.ps1 -Ref $tag."
